/* As seis coleções chegam em avisos separados; sem isto o ecrã era reconstruído
   seis vezes seguidas e o que estavas a tocar fugia debaixo do dedo. */
function pedirRender(){
  clearTimeout(pedirRender._t);
  pedirRender._t = setTimeout(render, 70);
}
function render(){
  const v = el("view");
  /* guardar o sítio onde estavas e as semanas que tinhas abertas */
  const y = window.scrollY, mesmaTab = v.dataset.tab === S.tab;
  const abertas = mesmaTab ? [...v.querySelectorAll("details.sem[open]")].map(d => d.dataset.sem) : [];
  v.dataset.tab = S.tab;
  if(!S.pronto){ v.innerHTML = `<div class="empty"><span class="big">A carregar os teus dados…</span></div>`; return; }
  if(S.tab === "registar"){
    delete v.dataset.dados;
    if(!v.dataset.form){ v.innerHTML = formRegistar(); v.dataset.form = "1"; montarFormularios(); }
    painelSessoes(); prevSessao(); prevTeste(); sincronizarPlanoSelect();
  } else if(S.tab === "dados"){
    delete v.dataset.form;
    /* a casca só se desenha uma vez: assim nada do que estás a escrever se perde quando chegam dados novos */
    if(v.dataset.dados !== "1"){ v.innerHTML = vistaDados(); v.dataset.dados = "1"; S.subFeito = null; }
    v.querySelectorAll("[data-sub]").forEach(b => b.setAttribute("aria-current", String(b.dataset.sub === S.sub)));
    if(S.subFeito !== S.sub){ renderSub(); S.subFeito = S.sub; }
  } else {
    delete v.dataset.form; delete v.dataset.dados;
    v.innerHTML = S.tab === "hoje" ? vistaHoje() : S.tab === "plano" ? vistaPlano() : vistaEvolucao();
    ligarTooltips(v);
    abertas.forEach(k => { const d = v.querySelector(`details.sem[data-sem="${k}"]`); if(d) d.open = true; });
  }
  /* a navegação só se redesenha quando muda de aba */
  const nav = TABS.map(t => `<button data-tab="${t.k}" ${S.tab===t.k?'aria-current="page"':""}>
    <span class="ic">${t.ic}</span>${t.n}</button>`).join("");
  const barra = el("tabbar");
  if(barra.dataset.sig !== S.tab){ barra.innerHTML = nav; el("sidenav").innerHTML = nav; barra.dataset.sig = S.tab; }
  /* o número que interessa, visível em todas as abas */
  const ag = el("agora");
  if(ag) ag.textContent = S.pronto ? `S${semanaAtual()}${FTP()?` · ${FTP()} W`:""}` : "";
  if(mesmaTab && y) window.scrollTo({top:y});
}
function renderSub(){
  const box = el("subview"); if(!box) return;
  box.innerHTML = S.sub === "perfil" ? subPerfil() : S.sub === "meus" ? subMeus()
    : S.sub === "zonas" ? subZonas() : S.sub === "excel" ? subExcel() : subGuia();
  const fm = el("fMeu");
  if(fm){
    const blocos = el("mBlocos");
    el("mAdd").addEventListener("click", () => { blocos.insertAdjacentHTML("beforeend", linhaBloco(null, 1)); prevMeu(); });
    fm.addEventListener("input", prevMeu);
    fm.addEventListener("click", ev => {
      const x = ev.target.closest("[data-tirar-bloco]"); if(!x) return;
      if(blocos.children.length > 1) x.closest("[data-bloco]").remove(); else toast("O treino precisa de pelo menos um bloco");
      prevMeu();
    });
    const cancelar = el("mCancel");
    if(cancelar) cancelar.addEventListener("click", () => { EDIT = null; renderSub(); });
    fm.addEventListener("submit", async ev => {
      ev.preventDefault();
      const t = el("mT").value.trim(), min = +el("mMin").value;
      if(!t || !min){ toast("Falta o nome ou a duração"); return; }
      const alvos = lerBlocos();
      if(!alvos.length){ toast("Dá um nome a pelo menos um bloco"); return; }
      const z = el("mZ").value, s = +el("mS").value || 0, manual = +el("mTss").value;
      const corpo = {t, loc:el("mLoc").value, min, z, s, d:el("mD").value,
        alvos, desc:el("mDesc").value.trim(), tss:manual || tssEstimado(min, alvos, z), tssManual:!!manual};
      const cid = (EDIT && EDIT.cid) || "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      if(await gravar("meus/"+cid, corpo)){
        toast(EDIT ? "Treino atualizado" : (s ? `Criado na semana ${s}` : "Criado na tua biblioteca"));
        EDIT = null; renderSub();
      }
    });
    prevMeu();
  }
  const f = el("fPerfil");
  if(f) f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const p = {...S.perfil,
      nome:el("pNome").value.trim(), nasc:el("pNasc").value, peso:+el("pPeso").value||null, altura:+el("pAltura").value||null,
      ftp:+el("pFtp").value||null, ftpData:el("pFtpData").value, fcmax:+el("pFcmax").value||null, fcrep:+el("pFcrep").value||null,
      pedaleira:+el("pPed").value||170, inicioPlano:el("pInicio").value ? segunda(el("pInicio").value) : "", objetivo:el("pObj").value.trim()};
    if(await gravar("perfil/main", p)) toast("Perfil guardado");
  });
  /* re-sincronizar o plano com a semana real, sem tocar no histórico */
  const bs = el("btnSemana");
  if(bs) bs.addEventListener("click", async () => {
    const n = Math.max(1, Math.min(999, +el("pSemana").value || 1));
    const ini = somaDias(segunda(hojeISO()), -(n-1)*7);
    if(await gravar("perfil/main", {...S.perfil, inicioPlano:ini})){
      S.pDe = S.pAte = null;
      toast(`Estás na semana ${n} · ${tituloCiclo(cicloNum(n))}`);
    }
  });
  const bc = el("btnCopia");
  if(bc) bc.addEventListener("click", () => { exportarCopia(); gravar("perfil/main", {...S.perfil, copiaEm:hojeISO()}); });
  const ic = el("inpCopia");
  if(ic) ic.addEventListener("change", e => { const f = e.target.files[0]; if(f) importarCopia(f); e.target.value = ""; });
  const be = el("btnExportar"); if(be) be.addEventListener("click", exportarExcel);
  const bi = el("inpImportar");
  if(bi) bi.addEventListener("change", e => { const f2 = e.target.files[0]; if(f2) importarExcel(f2); e.target.value = ""; });
}
/* Só as semanas à volta da atual: a lista inteira seria infinita num plano contínuo,
   e é sempre um treino destas semanas que estás a registar. */
function sincronizarPlanoSelect(){
  const sel = el("rPlano"); if(!sel) return;
  const sem = semanaAtual(), janela = [];
  for(let s = Math.max(1, sem-2); s <= sem+2; s++) janela.push(...daSemana(s));
  const biblio = S.meus.filter(p => !p.s);
  const assinatura = sem + ":" + janela.length + ":" + biblio.length;
  if(sel.dataset.sig === assinatura) return;
  const escolhido = sel.value;
  sel.innerHTML = `<option value="">— treino avulso —</option>` +
    janela.map(p => `<option value="${planoId(p)}">S${p.sAbs}${p.sAbs===sem?" (esta semana)":""} · ${esc(p.t)}${p.custom?" (meu)":""}</option>`).join("") +
    biblio.map(p => `<option value="${planoId(p)}">Biblioteca · ${esc(p.t)}</option>`).join("");
  sel.value = escolhido; sel.dataset.sig = assinatura;
}
function montarFormularios(){
  const hoje = hojeISO();
  el("rData").value = hoje; el("tData").value = hoje; el("cData").value = hoje;
  ["rMin","rPm","rNp"].forEach(id => el(id).addEventListener("input", prevSessao));
  ["tBruto","tMetodo","tPeso"].forEach(id => el(id).addEventListener("input", prevTeste));
  el("rPlano").addEventListener("change", e => {
    const p = acharPlano(e.target.value); if(!p) return;
    el("rTitulo").value = p.t; el("rMin").value = p.min;
    el("rLocal").value = ["Estrada","Rolo","Montanha"].includes(p.loc) ? p.loc : "Rolo"; prevSessao();
  });
  el("fSessao").addEventListener("submit", async ev => {
    ev.preventDefault();
    const base = {data:el("rData").value, titulo:el("rTitulo").value.trim(), local:el("rLocal").value,
      min:+el("rMin").value||0, km:+el("rKm").value||null, pm:+el("rPm").value||null, np:+el("rNp").value||null,
      fcm:+el("rFcm").value||null, fcx:+el("rFcx").value||null, cad:+el("rCad").value||null, rpe:+el("rRpe").value||null,
      notas:el("rNotas").value.trim(), plano:el("rPlano").value||"", peso:PESO()||null};
    if(!base.data || !base.min){ toast("Falta a data ou a duração"); return; }
    const m = metricas(base, FTP());
    const s = {...base, if:m.if??null, tss:m.tss??null, kj:m.kj??null, vi:m.vi??null, estimado:!!m.estimado};
    const id = "s"+base.data.replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,7);
    if(await gravar("sessoes/"+id, s)){
      if(s.plano) await gravar("feitas/"+s.plano, {data:base.data, sessao:id});
      toast(s.tss ? `Treino guardado · ${s.tss} TSS` : "Treino guardado");
      el("fSessao").reset(); el("rData").value = hojeISO(); prevSessao();
    }
  });
  el("fTeste").addEventListener("submit", async ev => {
    ev.preventDefault();
    const data = el("tData").value, met = el("tMetodo").value, bruto = +el("tBruto").value;
    if(!data || !bruto){ toast("Falta a data ou o valor medido"); return; }
    const ftp = Math.round(bruto*FATOR[met]), peso = +el("tPeso").value || PESO() || null;
    const ok = await gravar("testes/t"+data.replace(/-/g,""), {data, metodo:met, bruto, ftp, peso, notas:el("tNotas").value.trim()});
    if(ok){
      await gravar("perfil/main", {...S.perfil, ftp, ftpData:data, ...(peso?{peso}:{})});
      toast(`FTP atualizado para ${ftp} W`);
      el("fTeste").reset(); el("tData").value = hojeISO(); prevTeste();
    }
  });
  el("fRec").addEventListener("submit", async ev => {
    ev.preventDefault();
    const k = el("cDur").value, w = +el("cW").value, d = DURACOES.find(x => x.k === k);
    if(!w || !d){ toast("Falta a potência"); return; }
    const atual = S.recordes[k];
    if(atual && +atual.w >= w && !atual.exemplo){ toast(`Já tens ${atual.w} W nessa duração`); return; }
    if(await gravar("recordes/"+k, {w, s:d.s, data:el("cData").value||hojeISO()})){
      toast(`Recorde de ${d.r}: ${w} W`); el("cW").value = "";
    }
  });
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-sub],[data-ir],[data-ir-sub],[data-feita],[data-abrir],[data-registar],[data-apagar-sessao],[data-limpar-ex],[data-editar],[data-apagar-meu],[data-plano-antes],[data-plano-depois],[data-onde],[data-saltar],[data-fit]");
  if(!t) return;
  if(t.hasAttribute("data-plano-antes")){ S.pDe = Math.max(1, S.pDe-8); render(); return; }
  if(t.hasAttribute("data-plano-depois")){ S.pAte = S.pAte+8; render(); return; }
  if(t.dataset.tab){ S.tab = t.dataset.tab; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.ir){ S.tab = t.dataset.ir; if(t.dataset.ir === "dados") S.sub = "perfil"; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.irSub){ S.tab = "dados"; S.sub = t.dataset.irSub; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.sub){ S.sub = t.dataset.sub; render(); return; }
  if(t.dataset.editar){
    EDIT = S.meus.find(m => m.cid === t.dataset.editar) || null;
    S.tab = "dados"; S.sub = "meus"; render(); renderSub(); window.scrollTo({top:0});
    return;
  }
  if(t.dataset.apagarMeu){
    if(t.dataset.c !== "1"){ t.dataset.c = "1"; t.textContent = "Confirmar"; return; }
    const cid = t.dataset.apagarMeu;
    await apagar("meus/"+cid); await apagar("feitas/"+cid);
    if(EDIT && EDIT.cid === cid) EDIT = null;
    toast("Treino apagado"); if(S.tab === "dados") renderSub();
    return;
  }
  if(t.dataset.abrir){
    const art = t.closest("article"), p = acharPlano(t.dataset.abrir);
    if(art && p){ art.querySelector(".bd").insertAdjacentHTML("afterbegin",
      `<div class="alvos">${alvosHTML(p)}</div>${p.desc?`<p class="desc">${esc(p.desc)}</p>`:""}`); t.remove(); }
    return;
  }
  if(t.dataset.fit){
    const meu = S.meus.find(m => m.cid === t.dataset.fit);
    if(meu) await descarregarFit(meu);
    return;
  }
  if(t.dataset.onde){
    await gravar("onde/"+t.dataset.onde, {loc:t.dataset.loc});
    return;
  }
  if(t.dataset.saltar){
    const id = t.dataset.saltar, r = S.feitas[id];
    if(r && r.saltado) await apagar("feitas/"+id);
    else { await gravar("feitas/"+id, {data:hojeISO(), saltado:true}); toast("Saltado — passa ao próximo"); }
    return;
  }
  if(t.dataset.feita){
    const id = t.dataset.feita, r = S.feitas[id];
    if(r && !r.saltado) await apagar("feitas/"+id); else await gravar("feitas/"+id, {data:hojeISO()});
    return;
  }
  if(t.dataset.registar){
    const p = acharPlano(t.dataset.registar);
    S.tab = "registar"; render(); window.scrollTo({top:0});
    if(p){ el("rPlano").value = planoId(p); el("rTitulo").value = p.t; el("rMin").value = p.min;
      el("rLocal").value = ["Estrada","Rolo","Montanha"].includes(p.loc) ? p.loc : "Rolo"; prevSessao(); }
    return;
  }
  if(t.dataset.apagarSessao){
    if(t.dataset.c !== "1"){ t.dataset.c = "1"; t.textContent = "Confirmar"; return; }
    await apagar("sessoes/"+t.dataset.apagarSessao); toast("Treino apagado"); return;
  }
  if(t.hasAttribute("data-limpar-ex")){
    for(const s of S.sessoes) if(s.exemplo) await apagar("sessoes/"+s.id);
    for(const x of S.testes) if(x.exemplo) await apagar("testes/"+x.id);
    for(const k of Object.keys(S.recordes)) if(S.recordes[k].exemplo) await apagar("recordes/"+k);
    for(const k of Object.keys(S.feitas)) if(S.feitas[k].exemplo) await apagar("feitas/"+k);
    toast("Exemplos apagados — a app é tua");
  }
});
function tema(){
  const r = document.documentElement;
  const atual = r.getAttribute("data-theme");
  const escuro = atual ? atual === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", escuro ? "light" : "dark");
  try{ localStorage.setItem("dp-tema", escuro ? "light" : "dark"); }catch(e){}
}
el("themebtn").addEventListener("click", tema);
el("themebtn2").addEventListener("click", tema);
try{ const g = localStorage.getItem("dp-tema"); if(g) document.documentElement.setAttribute("data-theme", g); }catch(e){}
try{ const h = location.hash.replace("#",""); if(TABS.some(t=>t.k===h)) S.tab = h; }catch(e){}

carregarLocal();
render();
