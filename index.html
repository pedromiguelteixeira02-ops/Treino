<style>
/* Layout: painel de instrumentos — navegação inferior no telemóvel, lateral no PC;
   cartão da sessão do dia em destaque, tiles de métricas, gráficos empilhados. */
:root{
  --bg:#e9ecf0; --surface:#ffffff; --surface-2:#f3f6f8; --line:#d2dae1; --line-soft:#e4eaef;
  --ink:#111a24; --ink-2:#4a5a6b; --ink-3:#78889a;
  --accent:#d9480f; --accent-soft:#fdeee6; --steel:#1f5f8b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#1a7f54; --warn:#8a5d00; --crit:#b42318;
  --z1:#6b7a8c; --z2:#2a78d6; --z3:#1baf7a; --z4:#c98500; --z5:#eb6834; --z6:#e34948; --z7:#4a3aa7;
  --grid:#e2e8ee; --shadow:0 1px 2px rgba(17,26,36,.06),0 8px 24px rgba(17,26,36,.05);
  --disp:"Barlow Condensed","Barlow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c131b; --surface:#141d27; --surface-2:#1a2530; --line:#2a3744; --line-soft:#212d39;
  --ink:#eef3f7; --ink-2:#a8b7c5; --ink-3:#798a9a;
  --accent:#ff7a3d; --accent-soft:#2b1a11; --steel:#6fb3df;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#2fa06f; --warn:#d9a21a; --crit:#e66767;
  --z1:#8697a8; --z2:#3987e5; --z3:#199e70; --z4:#d9a21a; --z5:#d95926; --z6:#e66767; --z7:#9085e9;
  --grid:#24303c; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c131b; --surface:#141d27; --surface-2:#1a2530; --line:#2a3744; --line-soft:#212d39;
  --ink:#eef3f7; --ink-2:#a8b7c5; --ink-3:#798a9a;
  --accent:#ff7a3d; --accent-soft:#2b1a11; --steel:#6fb3df;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#2fa06f; --warn:#d9a21a; --crit:#e66767;
  --z1:#8697a8; --z2:#3987e5; --z3:#199e70; --z4:#d9a21a; --z5:#d95926; --z6:#e66767; --z7:#9085e9;
  --grid:#24303c; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  min-height:100%;margin:0;overflow-x:hidden;overscroll-behavior-y:contain;
  -webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--disp);font-weight:700;letter-spacing:.005em;text-wrap:balance;margin:0}
h1{font-size:1.65rem;line-height:1.1}
h2{font-size:1.3rem;line-height:1.15}
h3{font-size:1.06rem;line-height:1.2}
p{margin:0}
a{color:var(--steel)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;padding:0 16px calc(104px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  margin:0 -16px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--disp);font-size:1.18rem;letter-spacing:.01em;white-space:nowrap}
.brand span{font-size:.72rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:11px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;font-size:1.1rem;flex:none}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.iconbtn:active{background:var(--surface-2)}
.topbar .agora{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);white-space:nowrap}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{appearance:none;background:none;border:0;cursor:pointer;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:56px;padding:7px 2px;font:inherit;font-size:.72rem;font-weight:600;
  border-top:2px solid transparent;margin-top:-1px}
.tabbar button .ic{font-size:1.25rem;line-height:1}
.tabbar button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.tabbar button:active{background:var(--surface-2)}

/* ---------- blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.tiny{font-size:.78rem}
.sep{height:1px;background:var(--line-soft);border:0;margin:12px 0}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
.tile .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.tile .v{font-family:var(--disp);font-size:1.75rem;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:3px}
.tile .u{font-size:.78rem;color:var(--ink-3);font-family:var(--body);font-weight:500}
.tile .n{font-size:.76rem;color:var(--ink-2);margin-top:2px}

.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font-size:.74rem;font-weight:600;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.pill.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent)}
.pill .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:8px;padding:5px 9px;font-size:.8rem}
.chip b{font-family:var(--mono);font-size:.84rem;font-variant-numeric:tabular-nums}
.badge{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;
  border-radius:5px;padding:2px 6px;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-soft)}
.badge.ex{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.badge.ok{background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,var(--line))}

/* Alvos de toque: 46px de altura mínima nos botões normais, 40 nos pequenos —
   abaixo disso falha-se o toque no telemóvel com o dedo. */
button.btn,a.btn{appearance:none;font:inherit;font-weight:600;cursor:pointer;border-radius:10px;
  padding:10px 16px;min-height:46px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button.btn:hover,a.btn:hover{border-color:var(--ink-3)}
button.btn:active,a.btn:active{transform:scale(.98)}
button.btn.pri,a.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.pri:hover{filter:brightness(1.06)}
button.btn.ghost{background:transparent}
button.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.btn.sm{padding:7px 12px;min-height:40px;font-size:.86rem;border-radius:9px}
button.btn.wide{width:100%}
button.btn.grande{min-height:54px;font-size:1.02rem;border-radius:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:600;color:var(--ink-2);min-width:0}
/* 16px é o mínimo: abaixo disso o Safari do iPhone dá zoom à página ao focar o campo */
input,select,textarea{font-family:var(--body);font-size:16px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0;min-height:46px;
  appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:34px}
input[type=number]{font-family:var(--mono)}
input[type=date]{min-height:46px}
textarea{resize:vertical;min-height:72px;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* ---------- sessão / plano ---------- */
.sess{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.sess.hoje{border-color:color-mix(in srgb,var(--accent) 52%,var(--line));box-shadow:var(--shadow)}
.sess .hd{display:flex;gap:10px;align-items:flex-start;padding:12px 13px}
.sess .zb{width:4px;border-radius:4px;align-self:stretch;flex:none;background:var(--z2)}
.sess .ti{font-family:var(--disp);font-size:1.07rem;line-height:1.15}
.sess .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sess .bd{padding:0 13px 13px;display:flex;flex-direction:column;gap:10px}
.sess .desc{font-size:.9rem;color:var(--ink-2)}
.alvos{display:flex;flex-wrap:wrap;gap:6px}
.wk{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.wk .n{font-family:var(--disp);font-size:1.12rem}
.wk .l{flex:1;height:1px;background:var(--line)}
.done .ti{text-decoration:line-through;text-decoration-thickness:1px;color:var(--ink-3)}
.sess .bd .row>button{flex:1 1 auto}

/* cartão do treino que se segue: o número que vais usar na bicicleta, em grande */
.hero{background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 48%,var(--line));
  border-radius:16px;padding:15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.hero .cab{display:flex;gap:10px;align-items:flex-start}
.hero .zb{width:5px;border-radius:4px;align-self:stretch;flex:none}
.hero .ti{font-family:var(--disp);font-size:1.42rem;line-height:1.08;margin-top:1px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hero .desc{font-size:.92rem;color:var(--ink-2)}
.hero .watts{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  background:var(--accent-soft);border-radius:12px;padding:11px 13px}
.hero .watts .big{font-family:var(--disp);font-size:2.6rem;line-height:.92;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .watts .un{font-family:var(--body);font-size:1rem;font-weight:600;color:var(--accent)}
.hero .watts .lab{font-size:.82rem;color:var(--ink-2);flex:1 1 100%}
.garmin{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;
  border:1px dashed var(--line);border-radius:11px;padding:9px 11px}
.garmin .et{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.garmin code{font-family:var(--mono);font-size:.82rem;color:var(--ink);word-break:break-all;
  background:var(--surface-2);border-radius:6px;padding:2px 6px}

/* rolo ou fora: escolhes no dia, o plano só sugere */
.escolha{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.onde{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.onde button{appearance:none;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;border:0;
  background:none;color:var(--ink-3);padding:9px 16px;min-height:42px}
.onde button.on{background:var(--ink);color:var(--bg)}
.onde button:active{opacity:.75}

/* prioridade da sessão dentro da semana */
.prio{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--c) 42%,var(--line));
  background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);
  border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;white-space:nowrap}
.sess.saltada{opacity:.62}
.sess.saltada .ti{text-decoration:line-through;text-decoration-style:dotted;color:var(--ink-3)}
.hero .acoes{display:grid;grid-template-columns:1fr;gap:9px}
@media (min-width:520px){.hero .acoes{grid-template-columns:1fr 1fr}}

/* histórico sem tabela larga: uma linha por treino, legível a 375 px */
.hist{display:flex;flex-direction:column}
.hist .it{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.hist .it:last-child{border-bottom:0}
.hist .q{flex:1;min-width:0}
.hist .q .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .q .s{font-size:.77rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hist .v{font-family:var(--mono);font-size:1rem;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hist .v em{display:block;font-size:.68rem;color:var(--ink-3);font-style:normal;font-family:var(--body);
  text-transform:uppercase;letter-spacing:.07em}

/* semanas do plano fechadas por omissão: a semana atual é a única aberta */
details.sem{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
details.sem>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;
  flex-wrap:nowrap;overflow:hidden;padding:12px 14px;min-height:56px}
details.sem>summary::-webkit-details-marker{display:none}
details.sem>summary:active{background:var(--surface-2)}
details.sem>summary .nm{font-family:var(--disp);font-size:1.1rem;white-space:nowrap;flex:none}
details.sem>summary .pill{overflow:hidden;text-overflow:ellipsis;min-width:0}
details.sem>summary .ch{margin-left:auto;color:var(--ink-3);font-size:.9rem;flex:none}
details.sem[open]>summary .ch{transform:rotate(180deg)}
details.sem[open]>summary{border-bottom:1px solid var(--line-soft)}
details.sem .conteudo{padding:11px;display:flex;flex-direction:column;gap:9px}
details.sem.agora{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:var(--shadow)}
details.sem.agora>summary .nm{color:var(--accent)}

/* editor de blocos: nome em cima, números em baixo — cabe num telemóvel */
.bloco{border:1px solid var(--line-soft);border-radius:11px;padding:10px;background:var(--surface-2);
  display:flex;flex-direction:column;gap:8px}
.bloco>input[data-bl]{background:var(--surface)}
.bloco .nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:7px;align-items:end}
.bloco .nums .f{font-size:.7rem}
.bloco .nums input{padding:9px 6px;text-align:center;font-size:16px}
.bloco .nums button{min-width:40px}
@media (max-width:430px){
  .bloco .nums{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bloco .nums button{grid-column:3;justify-self:end}
}

/* campos secundários do registo, escondidos até serem pedidos */
details.mais{border:1px dashed var(--line);border-radius:11px;padding:0 12px}
details.mais>summary{list-style:none;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--ink-2);
  padding:13px 0;min-height:46px;display:flex;align-items:center;gap:7px}
details.mais>summary::-webkit-details-marker{display:none}

  "Base reforçada","Limiar avançado","VO2máx e resistência"];
const DIAS = {A:"Semana · treino 1", B:"Semana · treino 2", L:"Fim de semana · longo", X:"Treino extra"};

/* ============ treino contínuo ============
   O plano escrito tem MACRO semanas e nunca termina: a semana 27 volta ao
   conteúdo da semana 1 como ciclo 2, a 53 como ciclo 3, e por aí adiante.
   Como todos os alvos estão em percentagem do FTP, a mesma semana vale mais
   watts a cada volta — é o teste de reavaliação que faz o plano progredir.
   Nada tem de ser reiniciado à mão.                                         */
const MACRO = 26;
const semBase  = s => ((s-1) % MACRO) + 1;          /* 27 -> 1  */
const cicloNum = s => Math.floor((s-1)/MACRO) + 1;  /* 27 -> 2  */
const NOMES_CICLO = ["construir a base","consolidar e subir","manter e afinar"];
const tituloCiclo = n => `Ciclo ${n} · ${NOMES_CICLO[(n-1) % NOMES_CICLO.length]}`;
const ORDEM = {A:0, B:1, L:2, X:3};

/* id único por semana absoluta: as marcas de "feito" do ciclo 1 não contaminam o 2 */
const planoId = p => p.custom
  ? (p.sAbs ? `${p.cid}@${p.sAbs}` : p.cid)
  : `s${p.sAbs || p.s}${p.d}`;

/* catálogo: as MACRO semanas escritas + os treinos criados por ti */
function CATALOGO(){
  return PLANO.concat(S.meus).sort((x,y) => ((x.s||0)-(y.s||0)) || (ORDEM[x.d]-ORDEM[y.d]) || (x.t<y.t?-1:1));
}
/* os treinos de uma semana absoluta, já marcados com o ciclo a que pertencem */
function daSemana(sAbs){
  const base = semBase(sAbs), ciclo = cicloNum(sAbs);
  return CATALOGO().filter(p => p.s === base).map(p => ({...p, sAbs, ciclo, b: p.b}));
}
/* resolve um planoId de volta ao treino, seja do plano ou teu */
function acharPlano(id){
  if(!id) return null;
  const m = /^s(\d+)([ABLX])$/.exec(id);
  if(m){
    const sAbs = +m[1], p = PLANO.find(x => x.s === semBase(sAbs) && x.d === m[2]);
    return p ? {...p, sAbs, ciclo:cicloNum(sAbs)} : null;
  }
  const c = id.split("@"), meu = S.meus.find(x => x.cid === c[0]);
  if(!meu) return null;
  return c[1] ? {...meu, sAbs:+c[1], ciclo:cicloNum(+c[1])} : meu;
}

  "11A":"S11_VO2max_6x3","12A":"S12_VO2max_4x4"};
const ficheiroRolo = p => p.custom ? null : ROLO[`${semBase(p.sAbs || p.s)}${p.d}`] || null;

/* o que muda quando tiras o treino do sítio para que foi pensado */
function notaLocal(p, loc){
  if(loc === p.loc || (loc === "Estrada" && p.loc === "Livre")) return "";
  if(DENTRO(loc)){
    if(p.min >= 150) return `No rolo, ${fmtMin(p.min)} seguidos é muito mais duro do que na estrada. Faz 60 a 90 min com os mesmos blocos e dá-te por satisfeito — o resto do estímulo não compensa o desgaste.`;
    return "No rolo não há descidas para descansar: a potência fica mais constante e o treino sai mais exigente ao mesmo número. Liga o ventilador.";
  }
  if(/VO2|5×3|6×3|4×4|30\/30/.test(p.t))
    return "Lá fora estes blocos pedem uma subida contínua ou um plano sem cruzamentos — parar a meio estraga a repetição. Se não tiveres onde, faz este no rolo.";
  return "Lá fora a potência oscila com o vento e o terreno. Olha para a média do bloco, não para o número instantâneo.";
}

/* Nome do ficheiro .fit correspondente na pasta treinos-garmin/.
   Tem de dar exactamente o mesmo que o ferramentas/gerar_treinos_garmin.py. */
const semAcento = t => t.normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^\x00-\x7F]/g, "");
function ficheiroGarmin(p){
  if(p.custom || !(p.sAbs || p.s)) return null;
  const base = String(semBase(p.sAbs || p.s)).padStart(2, "0");
  const nome = semAcento(p.t).replace(/[^\w]+/g, "_").replace(/^_+|_+$/g, "").replace(/_+/g, "_").slice(0, 40);
  return `S${base}_${p.d}_${nome}.fit`;
}
/* ============ ficheiros .fit para o Garmin ============
   Mesma estrutura do ferramentas/fit.py: cabeçalho de 14 bytes, registos de
   definição e de dados, CRC no fim. Serve os treinos que tu crias — os 78 do
   plano já estão gerados na pasta treinos-garmin/.
   Os alvos vão em percentagem do FTP (valor = percentagem + 1000), por isso
   acompanham o FTP configurado no aparelho. */
const CRC_T = [0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,
               0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];
function crcFit(bytes, crc){
  crc = crc || 0;
  for(const b of bytes){
    let t = CRC_T[crc & 0xF];
    crc = ((crc >> 4) & 0x0FFF) ^ t ^ CRC_T[b & 0xF];
    t = CRC_T[crc & 0xF];
    crc = ((crc >> 4) & 0x0FFF) ^ t ^ CRC_T[(b >> 4) & 0xF];
  }
  return crc;
}
function fitTreino(nome, passos){

  const STEP = [[254,2,B.u16],[0,24,B.s],[1,1,B.e],[2,4,B.u32],
                [3,1,B.e],[4,4,B.u32],[5,4,B.u32],[6,4,B.u32],[7,1,B.e]];
  const u8  = (a,v) => a.push(v & 0xFF);
  const u16 = (a,v) => a.push(v & 0xFF, (v >> 8) & 0xFF);
  const u32 = (a,v) => a.push(v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF);
  /* sem acentos: há aparelhos que mostram UTF-8 como lixo */
  const str = (a,s,n) => { const b = new TextEncoder().encode(semAcento(String(s||"")));
    for(let i = 0; i < n; i++) a.push(i < b.length && i < n-1 ? b[i] : 0); };
  const c = [];
  const def = (local, glob, campos) => { u8(c,0x40|local); u8(c,0); u8(c,0); u16(c,glob);
    u8(c,campos.length); campos.forEach(f => { u8(c,f[0]); u8(c,f[1]); u8(c,f[2]); }); };
  const dado = (local, campos, v) => { u8(c,local);
    campos.forEach(([num,size,base]) => { const x = v[num];
      if(base === B.s) str(c, x, size);
      else if(base === B.e) u8(c, x == null ? 0xFF : x);
      else if(base === B.u16) u16(c, x == null ? 0xFFFF : x);
      else u32(c, x == null ? 0 : x); }); };

  def(0, 0, FID);
  dado(0, FID, {0:5, 1:255, 2:0, 3:1, 4:Math.floor(Date.now()/1000) - 631065600});
  def(1, 26, WKT);
  dado(1, WKT, {4:2, 6:passos.length, 8:nome});
  def(2, 27, STEP);
  passos.forEach((p,i) => {
    const alvo = p.lo != null;
    dado(2, STEP, {254:i, 0:p.nome||"", 1:0, 2:Math.round(p.segundos*1000),
      3: alvo?4:2, 4:0,
      5: alvo?Math.round(p.lo)+1000:0, 6: alvo?Math.round(p.hi)+1000:0,
      7: p.intensidade == null ? 0 : p.intensidade});
  });
  const cab = []; u8(cab,14); u8(cab,0x20); u16(cab,2140); u32(cab,c.length);
  cab.push(46,70,73,84);                       /* ".FIT" */
  u16(cab, crcFit(cab));
  const tudo = cab.concat(c);
  u16(tudo, crcFit(tudo));
  return new Uint8Array(tudo);
}
/* os passos de um treino teu, a partir dos blocos que escreveste */
function passosDoMeu(p){
  const fora = [];
  (p.alvos||[]).forEach(a => {
    if(a.length < 4 || !a[3]) return;          /* bloco sem duração não vira passo */
    const seg = a[3]*60, n = Math.max(1, a[4]||1), solto = (a[5]||0)*60;
    const inten = /^aquecimento/i.test(a[0]) ? 2 : /^arrefecer/i.test(a[0]) ? 3
                : /^(recupera|solto)/i.test(a[0]) ? 1 : 0;
    for(let i = 0; i < n; i++){
      fora.push({nome: n>1 ? `${a[0]} ${i+1}/${n}` : a[0], segundos:seg, lo:a[1], hi:a[2], intensidade:inten});
      if(solto && i < n-1) fora.push({nome:"Solto", segundos:solto, lo:50, hi:58, intensidade:1});
    }
    if(solto && n === 1) fora.push({nome:"Solto", segundos:solto, lo:50, hi:58, intensidade:1});
  });
  return fora;
}
async function descarregarFit(p){
  const passos = passosDoMeu(p);
  if(!passos.length){ toast("Põe a duração em pelo menos um bloco"); return; }
  const base = semAcento(p.t).replace(/[^\w]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40);
  try{
    descarregar(`MEU_${base}.fit`, new Blob([fitTreino(p.t, passos)]));
    toast("Copia-o para GARMIN/NEWFILES no aparelho");
  }catch(e){ toast("Não consegui gerar o ficheiro"); }
}

/* --- fórmulas --- */
const r1 = v => Math.round(v*10)/10;
const r2 = v => Math.round(v*100)/100;
function metricas(s, ftp){
  const sec = (+s.min||0)*60, pm = +s.pm||0, np = +s.np||pm;
  const o = {kj: pm&&sec ? Math.round(pm*sec/1000) : null, estimado: !s.np && !!pm};
  if(ftp && np && sec){
    o.if = r2(np/ftp);
    o.tss = Math.round((sec*np*(np/ftp))/(ftp*3600)*100);
    o.vi = pm ? r2(np/pm) : null;
  }
  return o;
}
function serieCarga(sessoes, dias){
  const porDia = {};
  sessoes.forEach(s => { if(s.data) porDia[s.data] = (porDia[s.data]||0) + (+s.tss||0); });
  const chaves = Object.keys(porDia).sort();
  if(!chaves.length) return [];
  const fim = hojeISO(), ini = chaves[0];
  const out = []; let ctl = 0, atl = 0;
  const kc = 1-Math.exp(-1/42), ka = 1-Math.exp(-1/7);
  for(let d = new Date(ini+"T12:00:00"); isoDe(d) <= fim; d.setDate(d.getDate()+1)){
    const k = isoDe(d), t = porDia[k]||0;
    ctl += (t-ctl)*kc; atl += (t-atl)*ka;
    out.push({data:k, tss:t, ctl:r1(ctl), atl:r1(atl), tsb:r1(ctl-atl)});
  }
  return dias ? out.slice(-dias) : out;
}
function lerTSB(v){
  if(v === null || v === undefined) return {t:"—", c:"--ink-3"};
  if(v > 15)  return {t:"Muito fresco — podes carregar", c:"--steel"};
  if(v > 5)   return {t:"Fresco e pronto a render", c:"--good"};
  if(v >= -10)return {t:"Equilibrado — segue o plano", c:"--good"};
  if(v >= -25)return {t:"Em carga — normal num bloco forte", c:"--warn"};
  return {t:"Fadiga alta — considera descarga", c:"--crit"};
}

/* --- datas --- */
const hojeISO = () => isoDe(new Date());
function isoDe(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function dLocal(iso){ return iso ? new Date(iso+"T12:00:00") : null; }
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const SEMDIAS = ["dom","seg","ter","qua","qui","sex","sáb"];
function fmtData(iso){ const d = dLocal(iso); return d ? `${d.getDate()} ${MESES[d.getMonth()]}` : "—"; }
function fmtDataLonga(iso){ const d = dLocal(iso); return d ? `${SEMDIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}` : "—"; }
function diasEntre(a,b){ return Math.floor((dLocal(b)-dLocal(a))/864e5); }
function segunda(iso){ const d = dLocal(iso); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return isoDe(d); }
function somaDias(iso,n){ const d = dLocal(iso); d.setDate(d.getDate()+n); return isoDe(d); }
function fmtMin(m){ const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h}h${String(r).padStart(2,"0")}` : `${h}h`) : `${r} min`; }

const S = {

  pDe:null, pAte:null,   /* janela de semanas mostrada no Plano */
};
const el = id => document.getElementById(id);
function toast(msg){

  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), 2600);
}
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const FTP = () => +S.perfil.ftp || 0;
const PESO = () => +S.perfil.peso || 0;
const wattsDe = pct => FTP() ? Math.round(FTP()*pct/100) : null;

/* ============ armazenamento ============
   Sem conta e sem servidor: tudo o que registas fica guardado neste browser,
   neste aparelho. O telemóvel tem o seu diário e o PC tem o dele — a ponte
   entre os dois é a exportação em Dados › Cópia de segurança.

   Os caminhos ("sessoes/<id>", "perfil/main") são os mesmos de antes, para o
   resto da app não ter de saber onde é que isto está guardado. */
const CHAVE = "diario-de-potencia-v1";

function carregarLocal(){
  let bruto = null;
  try{ bruto = localStorage.getItem(CHAVE); }catch(e){ S.semArmazenamento = true; }
  let d = {};
  try{ d = bruto ? JSON.parse(bruto) : {}; }catch(e){ d = {}; }
  aplicar(d);
  S.pronto = true;
}
function aplicar(d){
  S.perfil   = d.perfil   || {};
  S.sessoes  = d.sessoes  || [];
  S.testes   = d.testes   || [];
  S.recordes = d.recordes || {};
  S.feitas   = d.feitas   || {};
  S.onde     = d.onde     || {};
  S.meus     = (d.meus || []).map(m => ({custom:true, b:"Os meus treinos", ...m}));
}
function instantaneo(){
  return {versao:1, gravadoEm:new Date().toISOString(), perfil:S.perfil, sessoes:S.sessoes,
          testes:S.testes, recordes:S.recordes, feitas:S.feitas, onde:S.onde,
          meus:S.meus.map(({custom, b, ...resto}) => resto)};
}
function guardarLocal(){
  try{
    localStorage.setItem(CHAVE, JSON.stringify(instantaneo()));
    S.semArmazenamento = false;
    return true;
  }catch(e){
    S.semArmazenamento = true;
    toast("O browser não deixou guardar — faz uma cópia de segurança já");
    return false;
  }
}
/* gravar/apagar continuam a receber "coleção/id" como quando havia base de dados */
async function gravar(c, dados){
  const corte = c.indexOf("/"), col = c.slice(0, corte), id = c.slice(corte+1);
  const porId = (lista, chave) => {
    const i = lista.findIndex(x => x[chave] === id);
    return i >= 0 ? i : -1;
  };
  if(col === "perfil") S.perfil = {...dados};
  else if(col === "sessoes"){ const v = {id, ...dados}, i = porId(S.sessoes, "id");
    if(i >= 0) S.sessoes[i] = v; else S.sessoes.push(v); }
  else if(col === "testes"){ const v = {id, ...dados}, i = porId(S.testes, "id");
    if(i >= 0) S.testes[i] = v; else S.testes.push(v); }
  else if(col === "meus"){ const v = {cid:id, custom:true, b:"Os meus treinos", ...dados}, i = porId(S.meus, "cid");
    if(i >= 0) S.meus[i] = v; else S.meus.push(v); }
  else if(col === "recordes") S.recordes[id] = dados;
  else if(col === "feitas")   S.feitas[id]   = dados;
  else if(col === "onde")     S.onde[id]     = dados;
  else return false;
  const ok = guardarLocal();
  pedirRender();
  return ok;
}
async function apagar(c){
  const corte = c.indexOf("/"), col = c.slice(0, corte), id = c.slice(corte+1);
  if(col === "sessoes")       S.sessoes = S.sessoes.filter(x => x.id !== id);
  else if(col === "testes")   S.testes  = S.testes.filter(x => x.id !== id);
  else if(col === "meus")     S.meus    = S.meus.filter(x => x.cid !== id);
  else if(col === "recordes") delete S.recordes[id];
  else if(col === "feitas")   delete S.feitas[id];
  else if(col === "onde")     delete S.onde[id];
  else if(col === "perfil")   S.perfil  = {};
  else return false;
  guardarLocal();
  pedirRender();
  return true;
}
/* descarregar um ficheiro, sem depender de nada */
function descarregar(nome, blob){
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = nome; a.style.display = "none";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ============================================================
   3. Gráficos (SVG em linha, com hover e tabela)
   ============================================================ */
let GID = 0;
const ejes = {ml:44, mr:16, mt:12, mb:26};
/* A largura do viewBox acompanha o ecrã. Com um viewBox fixo de 640 num
   telemóvel de 375 px, tudo é reduzido a 54% e o texto dos eixos sairia a
   menos de 6 px — ilegível. Assim 11 unidades continuam a ser 11 px reais. */
function largGraf(){
  const v = el("view");
  const w = (v && v.clientWidth) || (window.innerWidth - 32) || 360;
  return Math.max(286, Math.min(760, Math.round(w - 34)));
}
function eixoY(min,max,n){
  if(max === min){ max = min+1; }
  const span = max-min, passo = Math.pow(10, Math.floor(Math.log10(span/n)));
  const cands = [1,2,2.5,5,10].map(m => m*passo);
  const p = cands.find(c => span/c <= n) || cands[cands.length-1];
  const lo = Math.floor(min/p)*p, hi = Math.ceil(max/p)*p, t = [];
  for(let v = lo; v <= hi+1e-9; v += p) t.push(r2(v));
  return {lo, hi, ticks:t};
}
function figura({titulo, sub, legenda, svg, tabela, nota}){

  return `<figure class="card" data-fig="${id}">

    ${legenda?`<div class="legend">${legenda}</div>`:""}
    <div class="chartbox">${svg}<div class="tt" data-tt></div></div>
    ${nota?`<p class="tiny muted">${nota}</p>`:""}
    ${tabela?`<details class="tbl"><summary>Ver os números em tabela</summary><div class="tw">${tabela}</div></details>`:""}
  </figure>`;
}
function vazio(titulo, texto, acao){
  return `<figure class="card"><figcaption><span class="t">${titulo}</span></figcaption>
    <div class="empty"><span class="big">${texto}</span>${acao?`<span class="small">${acao}</span>`:""}</div></figure>`;
}

/* linha única ou múltipla, eixo x por índice */
function grafLinhas({dados, series, rotulo, W=largGraf(), H=210, formato=(v=>v), yMin, areaPrimeira}){
  const w = W-ejes.ml-ejes.mr, h = H-ejes.mt-ejes.mb;
  let min = Infinity, max = -Infinity;
  dados.forEach(d => series.forEach(s => { const v = d[s.k]; if(v!=null){ if(v<min)min=v; if(v>max)max=v; } }));
  if(yMin != null) min = Math.min(min, yMin);
  const ey = eixoY(min, max, 4), yy = v => ejes.mt + h - (v-ey.lo)/(ey.hi-ey.lo)*h;
  const xx = i => dados.length === 1 ? ejes.ml+w/2 : ejes.ml + i*(w/(dados.length-1));
  const grade = ey.ticks.map(t => `<line x1="${ejes.ml}" x2="${ejes.ml+w}" y1="${r1(yy(t))}" y2="${r1(yy(t))}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${ejes.ml-8}" y="${r1(yy(t))+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">${formato(t)}</text>`).join("");
  const passo = Math.max(1, Math.ceil(dados.length/6));
  const eixoX = dados.map((d,i) => (i%passo===0 || i===dados.length-1)
    ? `<text x="${r1(xx(i))}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${d.x}</text>` : "").join("");
  let corpo = "";
  series.forEach((s,si) => {
    const pts = dados.map((d,i) => d[s.k]==null?null:[xx(i), yy(d[s.k])]).filter(Boolean);
    if(!pts.length) return;
    const linha = pts.map((p,i) => (i?"L":"M")+r1(p[0])+" "+r1(p[1])).join(" ");
    if(areaPrimeira && si === 0)
      corpo += `<path d="${linha} L${r1(pts[pts.length-1][0])} ${r1(yy(ey.lo))} L${r1(pts[0][0])} ${r1(yy(ey.lo))} Z" fill="var(${s.cor})" opacity=".09"/>`;
    corpo += `<path d="${linha}" fill="none" stroke="var(${s.cor})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    const u = pts[pts.length-1];
    corpo += `<circle cx="${r1(u[0])}" cy="${r1(u[1])}" r="4.5" fill="var(${s.cor})" stroke="var(--surface)" stroke-width="2"/>`;
    if(dados.length <= 14) pts.slice(0,-1).forEach(p =>
      corpo += `<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="4" fill="var(--surface)" stroke="var(${s.cor})" stroke-width="2"/>`);
    corpo += `<text x="${r1(u[0])-8}" y="${r1(u[1])-10}" text-anchor="end" font-size="12" font-weight="600"
      fill="var(${s.cor})" font-family="var(--mono)" stroke="var(--surface)" stroke-width="3.5"
      paint-order="stroke" stroke-linejoin="round">${formato(dados[dados.length-1][s.k])}</text>`;
  });
  const hit = dados.map((d,i) => `<rect x="${r1(xx(i)-w/(dados.length*2)-2)}" y="${ejes.mt}" width="${r1(w/dados.length+4)}" height="${h}"
    fill="transparent" data-i="${i}" data-cx="${r1(xx(i))}"/>`).join("");
  const dadosTT = dados.map(d => ({d:d.rot||d.x, vals:series.map(s => [s.nome, d[s.k]==null?"—":formato(d[s.k])+(s.un||""), s.cor])}));
  return {svg:`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${rotulo}" data-tt-src='${esc(JSON.stringify(dadosTT))}'>
    ${grade}${eixoX}
    <line x1="${ejes.ml}" x2="${ejes.ml}" y1="${ejes.mt}" y2="${ejes.mt+h}" stroke="var(--line)" stroke-width="1"/>
    <g data-cross hidden><line y1="${ejes.mt}" y2="${ejes.mt+h}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/></g>
    ${corpo}<g data-hits>${hit}</g></svg>`};
}
/* barras verticais, opcionalmente divergentes a partir do zero */
function grafBarras({dados, chave, cor, corNeg, W=largGraf(), H=190, formato=(v=>v), rotulo, media}){
  const w = W-ejes.ml-ejes.mr, h = H-ejes.mt-ejes.mb;
  const vals = dados.map(d => +d[chave]||0);
  const ey = eixoY(Math.min(0,...vals), Math.max(0,...vals), 4);
  const yy = v => ejes.mt + h - (v-ey.lo)/(ey.hi-ey.lo)*h;
  const bw = Math.max(2, w/dados.length - 2), y0 = yy(0);
  const grade = ey.ticks.map(t => `<line x1="${ejes.ml}" x2="${ejes.ml+w}" y1="${r1(yy(t))}" y2="${r1(yy(t))}"
      stroke="${t===0?"var(--line)":"var(--grid)"}" stroke-width="1"/>
    <text x="${ejes.ml-8}" y="${r1(yy(t))+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">${formato(t)}</text>`).join("");
  const barras = dados.map((d,i) => {
    const v = +d[chave]||0, x = ejes.ml + i*(w/dados.length) + 1, y = v>=0?yy(v):y0, alt = Math.max(1, Math.abs(yy(v)-y0));
    const c = v<0 && corNeg ? corNeg : cor;
    return `<rect x="${r1(x)}" y="${r1(y)}" width="${r1(bw)}" height="${r1(alt)}" rx="3" fill="var(${c})"/>`;
  }).join("");
  const passo = Math.max(1, Math.ceil(dados.length/6));
  const eixoX = dados.map((d,i) => (i%passo===0 || i===dados.length-1)
    ? `<text x="${r1(ejes.ml+i*(w/dados.length)+bw/2+1)}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${d.x}</text>` : "").join("");
  const linhaMedia = media!=null ? `<line x1="${ejes.ml}" x2="${ejes.ml+w}" y1="${r1(yy(media))}" y2="${r1(yy(media))}"
      stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${ejes.ml+w}" y="${r1(yy(media))-7}" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="var(--mono)"
      stroke="var(--surface)" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">média ${formato(media)}</text>` : "";
  const hit = dados.map((d,i) => `<rect x="${r1(ejes.ml+i*(w/dados.length))}" y="${ejes.mt}" width="${r1(w/dados.length)}" height="${h}"
    fill="transparent" data-i="${i}" data-cx="${r1(ejes.ml+i*(w/dados.length)+bw/2+1)}"/>`).join("");
  const dadosTT = dados.map(d => ({d:d.rot||d.x, vals:[[d.nome||"Valor", formato(+d[chave]||0)+(d.un||""), (+d[chave]<0&&corNeg)?corNeg:cor]]}));
  return {svg:`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${rotulo}" data-tt-src='${esc(JSON.stringify(dadosTT))}'>
    ${grade}${eixoX}${linhaMedia}${barras}<g data-hits>${hit}</g></svg>`};
}
/* curva de potência: eixo x logarítmico em segundos */
function grafCurva({pontos, W=largGraf(), H=215}){
  const w = W-ejes.ml-ejes.mr, h = H-ejes.mt-ejes.mb;
  const lx = s => Math.log10(s), x0 = lx(5), x1 = lx(3600);
  const xx = s => ejes.ml + (lx(s)-x0)/(x1-x0)*w;
  const ey = eixoY(0, Math.max(...pontos.map(p=>p.w)), 4);
  const yy = v => ejes.mt + h - (v-ey.lo)/(ey.hi-ey.lo)*h;
  const grade = ey.ticks.map(t => `<line x1="${ejes.ml}" x2="${ejes.ml+w}" y1="${r1(yy(t))}" y2="${r1(yy(t))}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${ejes.ml-8}" y="${r1(yy(t))+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">${t}</text>`).join("");
  const marcas = [[5,"5 s"],[30,"30 s"],[60,"1 min"],[300,"5 min"],[1200,"20 min"],[3600,"60 min"]];
  const eixoX = marcas.map(([s,r]) => `<text x="${r1(xx(s))}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${r}</text>`).join("");
  const linha = pontos.map((p,i) => (i?"L":"M")+r1(xx(p.s))+" "+r1(yy(p.w))).join(" ");
  const pts = pontos.map(p => `<circle cx="${r1(xx(p.s))}" cy="${r1(yy(p.w))}" r="4.5" fill="var(--surface)" stroke="var(--s2)" stroke-width="2"/>`).join("");
  const hit = pontos.map((p,i) => `<rect x="${r1(xx(p.s)-14)}" y="${ejes.mt}" width="28" height="${h}" fill="transparent" data-i="${i}" data-cx="${r1(xx(p.s))}"/>`).join("");
  const dadosTT = pontos.map(p => ({d:p.r, vals:[["Melhor potência", p.w+" W", "--s2"], ["W/kg", PESO()?r2(p.w/PESO()):"—", "--ink-3"], ["Data", fmtData(p.data)||"—", "--ink-3"]]}));
  return {svg:`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de potência" data-tt-src='${esc(JSON.stringify(dadosTT))}'>
    ${grade}${eixoX}
    <line x1="${ejes.ml}" x2="${ejes.ml}" y1="${ejes.mt}" y2="${ejes.mt+h}" stroke="var(--line)" stroke-width="1"/>
    <path d="${linha}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>${pts}
    <g data-hits>${hit}</g></svg>`};
}
/* liga rato e toque a todos os gráficos presentes */
function ligarTooltips(raiz){
  raiz.querySelectorAll("svg.chart[data-tt-src]").forEach(svg => {
    const caixa = svg.closest(".chartbox"), tt = caixa && caixa.querySelector("[data-tt]");
    if(!tt) return;
    let dados; try{ dados = JSON.parse(svg.getAttribute("data-tt-src")); }catch(e){ return; }
    const cross = svg.querySelector("[data-cross]");
    const esconder = () => { tt.classList.remove("on"); if(cross) cross.hidden = true; };
    const mostrar = (alvo, clientY) => {
      const i = +alvo.getAttribute("data-i"), d = dados[i]; if(!d) return;
      tt.innerHTML = `<div class="d">${esc(d.d)}</div>` + d.vals.map(v =>
        `<div class="r"><span style="color:var(${v[2]})">${esc(v[0])}</span><b>${esc(v[1])}</b></div>`).join("");
      tt.classList.add("on");
      const cx = +alvo.getAttribute("data-cx"), vb = svg.viewBox.baseVal;
      const px = cx*(caixa.clientWidth/vb.width), lar = tt.offsetWidth;
      tt.style.left = Math.max(2, Math.min(caixa.clientWidth-lar-2, px-lar/2))+"px";
      /* no telemóvel o dedo tapa o balão: se o toque foi na metade de cima, manda-o para baixo */
      const r = caixa.getBoundingClientRect();
      const emCima = clientY != null && (clientY-r.top) < r.height/2;
      tt.style.top = emCima ? "" : "0px";
      tt.style.bottom = emCima ? "0px" : "";
      if(cross){ cross.hidden = false; cross.firstElementChild.setAttribute("x1", cx); cross.firstElementChild.setAttribute("x2", cx); }
    };
    /* arrastar o dedo ao longo do gráfico percorre os pontos */
    const doPonto = ev => {
      const n = document.elementFromPoint(ev.clientX, ev.clientY);
      const alvo = n && n.closest && n.closest("[data-i]");
      if(alvo && svg.contains(alvo)) mostrar(alvo, ev.clientY);
    };
    svg.querySelectorAll("[data-hits] rect").forEach(r =>
      r.addEventListener("pointerenter", ev => { if(ev.pointerType === "mouse") mostrar(r, ev.clientY); }));
    svg.addEventListener("pointerdown", ev => { svg.dataset.ativo = "1"; doPonto(ev); });
    svg.addEventListener("pointermove", ev => { if(svg.dataset.ativo === "1") doPonto(ev); });
    svg.addEventListener("pointerup", () => { delete svg.dataset.ativo; });
    svg.addEventListener("pointercancel", () => { delete svg.dataset.ativo; esconder(); });
    svg.addEventListener("pointerleave", ev => { if(ev.pointerType === "mouse") esconder(); });
  });
}
/* um único ouvinte: ao rolar a página, os balões abertos desaparecem */
window.addEventListener("scroll", () => {
  document.querySelectorAll(".tt.on").forEach(t => {
    t.classList.remove("on");
    const caixa = t.closest(".chartbox"), g = caixa && caixa.querySelector("[data-cross]");
    if(g) g.hidden = true;
  });
}, {passive:true});

/* sem limite superior: o plano acompanha-te enquanto treinares */
function semanaAtual(){
  const ini = S.perfil.inicioPlano; if(!ini) return 1;
  return Math.max(1, Math.floor(diasEntre(segunda(ini), hojeISO())/7)+1);
}
/* segunda-feira em que começa uma semana absoluta do plano */
function segundaDaSemana(sAbs){
  const ini = S.perfil.inicioPlano;
  return ini ? somaDias(segunda(ini), (sAbs-1)*7) : null;
}
function statsJanela(dias){
  const limite = somaDias(hojeISO(), -dias+1);
  const ss = S.sessoes.filter(s => s.data >= limite);
  return {n:ss.length, tss:ss.reduce((a,s)=>a+(+s.tss||0),0), min:ss.reduce((a,s)=>a+(+s.min||0),0), km:ss.reduce((a,s)=>a+(+s.km||0),0)};
}
const temExemplos = () => S.sessoes.some(s=>s.exemplo) || S.testes.some(t=>t.exemplo) || Object.values(S.recordes).some(r=>r.exemplo);

function tileHTML(k,v,u,n){ return `<div class="tile"><div class="k">${k}</div><div class="v">${v}${u?`<span class="u"> ${u}</span>`:""}</div>${n?`<div class="n">${n}</div>`:""}</div>`; }

function pilulaZona(z){ const Z = ZONAS.find(x=>x.z===z)||ZONAS[1]; return `<span class="pill"><span class="dot" style="background:var(${Z.cor})"></span>${Z.z} ${Z.nome}</span>`; }

/* ---- prioridade dentro da semana ----
   Numa semana que não corre bem, a ordem a salvar é: a sessão de qualidade (ou
   o teste, se o houver), depois o longo, e só então o dia fácil — que existe
   para os outros dois correrem bem e é o primeiro a cair. */
const ehTeste = p => /^Teste de FTP/.test(p.t);
function prioDe(p){
  if(!p.sAbs) return 3;
  const temTeste = daSemana(p.sAbs).some(ehTeste);
  if(temTeste) return ehTeste(p) ? 1 : (p.d === "L" ? 2 : 3);
  return p.d === "A" ? 1 : p.d === "L" ? 2 : 3;
}
const PRIO = {1:["essencial","--accent"], 2:["importante","--steel"], 3:["se der","--ink-3"]};
function selo(p){
  const [txt, cor] = PRIO[prioDe(p)];
  return `<span class="prio" style="--c:var(${cor})">${txt}</span>`;
}

/* O bloco que define o treino — é o número que vais seguir na bicicleta.
   Aquecimento, arrefecimento e recuperação ficam de fora: num teste de rampa
   o bloco mais intenso em percentagem é o aquecimento, e anunciá-lo seria mentir. */
const APOIO = /^(aquecimento|arrefecer|recupera)/i;
function blocoPrincipal(p){
  const al = p.alvos || [];
  const com = al.filter(a => a.length >= 3 && !APOIO.test(a[0]));
  if(com.length) return {tipo:"pct", a:com.reduce((m,a) => ((a[1]+a[2])/2 > (m[1]+m[2])/2 ? a : m))};
  const txt = al.find(a => a.length <= 2 && !APOIO.test(a[0]));
  return txt ? {tipo:"texto", a:txt} : null;
}
/* cartão grande do treino que se segue */
function heroHTML(p){

    ${nota?`<p class="tiny muted" style="margin-top:-4px">${esc(nota)}</p>`:""}
    ${painel}
    ${ficheiroHTML(p)}
    <div class="alvos">${alvosHTML(p)}</div>

    <div class="row" style="margin-top:9px"><button class="btn sm" data-limpar-ex>Apagar os exemplos</button></div></div></div>`);

          <div class="s">${fmtData(s.data)} · ${fmtMin(+s.min||0)}${s.np||s.pm?` · ${s.np||s.pm} W`:""}${s.if!=null?` · IF ${r2(s.if)}`:""}</div></div>
        <div class="v">${s.tss||"—"}<em>TSS</em></div></div>`).join("")}</div>
      <div class="row" style="margin-top:12px"><button class="btn sm ghost wide" data-ir="evolucao">Ver a evolução</button></div></div>`);
  }
  return partes.join("");
}

/* Mostra uma janela de semanas em volta da atual, não as 26 de uma vez:
   no telemóvel, 78 treinos abertos seriam um rolo interminável. */
function janelaPlano(sem){
  if(S.pDe == null || sem < S.pDe || sem > S.pAte){ S.pDe = Math.max(1, sem-1); S.pAte = sem+7; }
  return [S.pDe, S.pAte];

function vistaPlano(){

  for(let s = iniC; s <= fimC; s++) daSemana(s).forEach(p => { totalC++; if(S.feitas[planoId(p)]) feitosC++; });
  const pct = Math.round(feitosC/Math.max(1,totalC)*100);
  const biblioteca = S.meus.filter(p => !p.s);

  const partes = [`<div><h1>Plano contínuo</h1>
    <p class="muted small" style="margin-top:4px">${MACRO} semanas que se repetem sem fim — três treinos por semana, dois à semana e o longo ao fim de semana.
    Os watts saem do teu FTP${FTP()?` de ${FTP()} W`:" — preenche-o nos Dados"}, por isso a mesma semana vale mais watts a cada volta.
    Não há nada para reiniciar: depois da semana ${MACRO} vem a ${MACRO+1}, que é a semana 1 do ciclo seguinte.</p></div>
  <div class="card">
    <div class="eyebrow">${esc(tituloCiclo(ciclo))}</div>
    <div style="font-family:var(--disp);font-size:1.3rem;margin-top:2px">${feitosC} de ${totalC} treinos feitos neste ciclo</div>
    <div style="margin-top:11px;height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden">
      <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:5px"></div></div>
    <div class="row" style="margin-top:12px">
      <span class="pill on">estás na semana ${sem}</span>
      <span class="pill">${semBase(sem)} de ${MACRO} do ciclo</span>
      ${S.perfil.inicioPlano?`<span class="pill">início ${fmtData(S.perfil.inicioPlano)}</span>`:""}</div>
    <div class="row" style="margin-top:11px">
      <button class="btn sm" data-ir-sub="perfil">Ajustar a semana</button>
      <button class="btn sm pri" data-ir-sub="meus">Criar um treino</button></div></div>`];

  if(biblioteca.length) partes.push(`<div>
    <div class="wk"><span class="n">A minha biblioteca</span><span class="pill">${biblioteca.length} ${biblioteca.length===1?"treino":"treinos"}</span><span class="l"></span></div>
    <p class="tiny muted" style="margin:-2px 0 8px">Treinos teus sem semana atribuída — usa-os quando te apetecer, em vez do que está no plano.</p>
    <div style="display:flex;flex-direction:column;gap:9px">${biblioteca.map(p=>sessaoHTML(p,{aberta:true})).join("")}</div></div>`);

  const [de, ate] = janelaPlano(sem);
  if(de > 1) partes.push(`<div class="row"><button class="btn sm ghost wide" data-plano-antes>↑ Semanas anteriores</button></div>`);
  for(let s = de; s <= ate; s++){
    const ss = daSemana(s); if(!ss.length) continue;
    const atual = s === sem, feitos = ss.filter(p => S.feitas[planoId(p)]).length;
    const seg = segundaDaSemana(s), novoCiclo = semBase(s) === 1;
    partes.push(`<details class="sem${atual?" agora":""}" data-sem="${s}"${atual?" open":""}>
      <summary>
        <span class="nm">Semana ${s}</span>
        <span class="pill${atual?" on":""}">${esc(ss[0].b)}</span>
        ${feitos?`<span class="badge ok">${feitos}/${ss.length}</span>`:""}
        <span class="ch">▾</span>
      </summary>
      <div class="conteudo">
        <div class="row" style="gap:6px">
          ${seg?`<span class="pill">semana de ${fmtData(seg)}</span>`:""}
          <span class="pill">${ss.reduce((a,p)=>a+(+p.tss||0),0)} TSS</span>
          <span class="pill">${fmtMin(ss.reduce((a,p)=>a+(+p.min||0),0))}</span>
          ${novoCiclo?`<span class="pill on">começa o ciclo ${cicloNum(s)}</span>`:""}</div>
        ${ss.map(p=>sessaoHTML(p,{aberta:atual})).join("")}
      </div></details>`);
  }
  partes.push(`<div class="row"><button class="btn sm ghost wide" data-plano-depois>↓ Mais semanas</button></div>`);
  return partes.join("");
}

function painelSessoes(){
  const box = el("listaSessoes"); if(!box) return;
  const ss = [...S.sessoes].sort((a,b)=>(a.data<b.data?1:-1));
  const mostra = ss.slice(0, 30);
  /* lista em vez de tabela: dez colunas num ecrã de 375 px obrigavam a arrastar para o lado */
  box.innerHTML = `<h3>Histórico · ${ss.length} ${ss.length===1?"treino":"treinos"}</h3>` + (ss.length ? `
    <div class="hist" style="margin-top:6px">${mostra.map(s=>{
      const det = [fmtData(s.data), fmtMin(+s.min||0)];
      if(s.np||s.pm) det.push((s.np||s.pm)+" W");
      if(s.if!=null) det.push("IF "+r2(s.if));
      if(s.km) det.push(r1(s.km)+" km");
      if(s.kj) det.push(s.kj+" kJ");
      if(s.rpe) det.push("RPE "+s.rpe);
      return `<div class="it">
        <div class="q"><div class="t">${esc(s.titulo||"Treino")}${s.exemplo?' <span class="badge ex">ex.</span>':""}${s.estimado?' <span class="badge">est.</span>':""}</div>
          <div class="s">${det.join(" · ")}</div></div>
        <div class="v">${s.tss||"—"}<em>TSS</em></div>
        <button class="btn sm ghost danger" data-apagar-sessao="${esc(s.id)}" aria-label="Apagar este treino">✕</button>
      </div>`; }).join("")}</div>
    ${ss.length > mostra.length ? `<p class="tiny muted" style="margin-top:10px">A mostrar os ${mostra.length} mais recentes. O histórico completo sai na exportação para Excel.</p>` : ""}`
    : `<div class="empty" style="margin-top:10px"><span class="big">Ainda sem treinos</span><span class="small">O primeiro registo abre os gráficos de evolução.</span></div>`);
}
function prevSessao(){
  const box = el("rPrev"); if(!box) return;
  const s = {min:+el("rMin").value, pm:+el("rPm").value, np:+el("rNp").value};

  if(!s.min){ box.innerHTML = `<span class="tiny muted">Preenche a duração e a potência para ver IF, TSS e kJ.</span>`; return; }
  box.innerHTML = `<span class="chip">Duração <b>${fmtMin(s.min)}</b></span>

    ${m.kj?`<span class="chip">Trabalho <b>${m.kj} kJ</b></span>`:""}
    ${m.vi?`<span class="chip">Variabilidade <b>${m.vi}</b></span>`:""}
    ${m.if!=null?`<span class="pill"><span class="dot" style="background:var(${zonaDe(Math.round(m.if*100)).cor})"></span>esforço médio em ${zonaDe(Math.round(m.if*100)).z}</span>`:""}`;

const FATOR = {rampa:0.75, "20min":0.95, "8min":0.90, direto:1};
function prevTeste(){
  const box = el("tPrev"); if(!box) return;
  const bruto = +el("tBruto").value, met = el("tMetodo").value, peso = +el("tPeso").value || PESO();
  if(!bruto){ box.innerHTML = `<span class="tiny muted">Introduz o valor medido para ver o FTP resultante.</span>`; return; }
  const ftp = Math.round(bruto*FATOR[met]);
  const ant = FTP(), dif = ant ? Math.round((ftp-ant)/ant*1000)/10 : null;
  box.innerHTML = `<span class="chip">FTP novo <b>${ftp} W</b></span>
    ${peso?`<span class="chip">Relação peso/potência <b>${r2(ftp/peso)} W/kg</b></span>`:""}
    ${dif!=null?`<span class="chip">Variação <b style="color:var(${dif>=0?"--good":"--crit"})">${dif>0?"+":""}${dif}%</b></span>`:""}`;
}

/* ---- EVOLUÇÃO ---- */
function vistaEvolucao(){
  const partes = [];
  const carga = serieCarga(S.sessoes), u = carga[carga.length-1];
  const j7 = statsJanela(7), j28 = statsJanela(28);
  const testes = [...S.testes].sort((a,b)=>(a.data<b.data?-1:1));
  const lt = lerTSB(u?u.tsb:null);

  partes.push(`<div><h1>Evolução</h1><p class="muted small" style="margin-top:4px">Quatro leituras: quanto consegues (FTP), quanto treinas (TSS), quanta base tens (forma) e quão descansado estás (frescura).</p></div>`);
  if(temExemplos()) partes.push(`<div class="banner info"><span class="ic">ℹ</span><div><b>Inclui dados de exemplo</b>
    Os gráficos mostram registos de demonstração. <button class="btn sm" data-limpar-ex style="margin-top:7px">Apagar os exemplos</button></div></div>`);

  partes.push(`<div class="tiles">
    ${tileHTML("FTP", FTP()||"—", FTP()?"W":"", FTP()&&PESO()?`${r2(FTP()/PESO())} W/kg · ${PESO()} kg`:"preenche o perfil")}
    ${tileHTML("Forma (CTL)", u?Math.round(u.ctl):"—","", "carga média a 42 dias")}
    ${tileHTML("Fadiga (ATL)", u?Math.round(u.atl):"—","", "carga média a 7 dias")}
    ${tileHTML("Frescura (TSB)", u?(u.tsb>0?"+":"")+Math.round(u.tsb):"—","", `<span style="color:var(${lt.c})">${lt.t}</span>`)}
    ${tileHTML("7 dias", j7.tss, "TSS", `${fmtMin(j7.min)} · ${r1(j7.km)} km`)}
    ${tileHTML("28 dias", j28.tss, "TSS", `${j28.n} sessões · ${fmtMin(j28.min)}`)}
    ${tileHTML("Horas / semana", j28.n?r1(j28.min/60/4):"—","h", "média das últimas 4 semanas")}
    ${tileHTML("Trabalho 28 dias", S.sessoes.filter(s=>s.data>=somaDias(hojeISO(),-27)).reduce((a,s)=>a+(+s.kj||0),0)||"—","kJ","energia produzida")}
  </div>`);

  /* FTP */
  if(testes.length >= 1){
    const dados = testes.map(t => ({x:fmtData(t.data), rot:fmtDataLonga(t.data), ftp:+t.ftp||0}));
    const g = grafLinhas({dados, series:[{k:"ftp", nome:"FTP", cor:"--s1", un:" W"}], rotulo:"Evolução do FTP", areaPrimeira:true, H:200, yMin:Math.min(...dados.map(d=>d.ftp))*0.9});
    const prim = testes[0], ult = testes[testes.length-1];
    const dif = prim.ftp && testes.length>1 ? Math.round((ult.ftp-prim.ftp)/prim.ftp*1000)/10 : null;
    partes.push(figura({titulo:"FTP teste a teste", sub: dif!=null?`${dif>0?"+":""}${dif}% desde ${fmtData(prim.data)}`:"um teste registado",
      svg:g.svg, nota:"O FTP é a potência que consegues manter cerca de uma hora. É o número que define todas as zonas.",
      tabela:`<table><thead><tr><th>Data</th><th>Método</th><th>Medido</th><th>FTP</th><th>W/kg</th></tr></thead><tbody>
        ${testes.map(t=>`<tr><td class="n">${fmtData(t.data)}</td><td>${esc(t.metodo||"—")}</td><td class="n">${t.bruto||"—"} W</td>
        <td class="n">${t.ftp} W</td><td class="n">${t.peso?r2(t.ftp/t.peso):"—"}</td></tr>`).join("")}</tbody></table>`}));
  } else {
    partes.push(vazio("FTP teste a teste","Ainda não há nenhum teste","Faz o teste da semana 1 e registo-o em Registar › Teste de FTP. A partir do segundo teste aparece aqui a linha de progressão."));
  }

  /* TSS semanal */
  if(S.sessoes.length){
    const sem = {};
    S.sessoes.forEach(s => { const k = segunda(s.data); sem[k] = (sem[k]||0) + (+s.tss||0); });
    const chaves = Object.keys(sem).sort(); const prim = chaves[0];
    const todas = []; for(let k = prim; k <= segunda(hojeISO()); k = somaDias(k,7)) todas.push({x:fmtData(k), rot:`semana de ${fmtDataLonga(k)}`, tss:sem[k]||0, nome:"Carga da semana"});
    const ultimas = todas.slice(-12);
    const media = Math.round(ultimas.reduce((a,d)=>a+d.tss,0)/ultimas.length);
    const g = grafBarras({dados:ultimas, chave:"tss", cor:"--s1", rotulo:"TSS por semana", media, H:195});
    partes.push(figura({titulo:"Carga por semana", sub:`últimas ${ultimas.length} semanas, em TSS`, svg:g.svg,
      nota:"Sobe a carga no máximo 5–8% por semana e deixa uma semana leve a cada quatro. Saltos grandes é como se chega lesionado ou constipado.",
      tabela:`<table><thead><tr><th>Semana de</th><th>TSS</th></tr></thead><tbody>${ultimas.map(d=>`<tr><td>${d.x}</td><td class="n">${d.tss}</td></tr>`).join("")}</tbody></table>`}));
  } else partes.push(vazio("Carga por semana","Sem treinos registados","Cada treino que registares entra aqui como TSS — a medida de quanto te custou a sessão."));

  /* CTL / ATL + TSB */
  if(carga.length > 2){
    const jan = carga.slice(-90);
    const dados = jan.map(d => ({x:fmtData(d.data), rot:fmtDataLonga(d.data), ctl:d.ctl, atl:d.atl, tsb:d.tsb, nome:"Frescura (TSB)"}));
    const g = grafLinhas({dados, series:[{k:"ctl",nome:"Forma (CTL)",cor:"--s1"},{k:"atl",nome:"Fadiga (ATL)",cor:"--s2"}],
      rotulo:"Forma e fadiga", H:210, formato:v=>Math.round(v), yMin:0});
    partes.push(figura({titulo:"Forma e fadiga", sub:`últimos ${jan.length} dias, na mesma unidade (TSS por dia)`,
      legenda:`<span><i style="background:var(--s1)"></i>Forma (CTL) — base acumulada</span><span><i style="background:var(--s2)"></i>Fadiga (ATL) — cansaço recente</span>`,
      svg:g.svg, nota:"A forma sobe devagar e desce devagar; a fadiga sobe e desce depressa. Quando as duas se cruzam para baixo, estás a perder base.",
      tabela:`<table><thead><tr><th>Data</th><th>TSS</th><th>CTL</th><th>ATL</th><th>TSB</th></tr></thead><tbody>
        ${jan.slice(-30).reverse().map(d=>`<tr><td class="n">${fmtData(d.data)}</td><td class="n">${d.tss||"—"}</td>
        <td class="n">${Math.round(d.ctl)}</td><td class="n">${Math.round(d.atl)}</td><td class="n">${d.tsb>0?"+":""}${Math.round(d.tsb)}</td></tr>`).join("")}</tbody></table>`}));
    const gb = grafBarras({dados, chave:"tsb", cor:"--s3", corNeg:"--s2", rotulo:"Frescura diária", H:170, formato:v=>Math.round(v)});
    partes.push(figura({titulo:"Frescura, dia a dia", sub:"forma menos fadiga — acima de zero estás descansado",
      svg:gb.svg, nota:"Entre −10 e +10 é o normal de quem treina. Abaixo de −25 durante dias seguidos é sinal para aliviar; acima de +15 estás fresco para um teste ou uma prova."}));
  }

  /* curva de potência */
  const pts = DURACOES.map(d => ({...d, ...(S.recordes[d.k]||{})})).filter(p => +p.w > 0).map(p => ({s:p.s, r:p.r, w:+p.w, data:p.data}));
  if(pts.length >= 3){
    const g = grafCurva({pontos:pts});
    partes.push(figura({titulo:"Curva de potência", sub:"os teus melhores valores por duração", svg:g.svg,
      nota:"Uma curva que desce a pique à esquerda é motor de sprint; uma curva plana à direita é motor de resistência. Compara daqui a três meses.",
      tabela:`<table><thead><tr><th>Duração</th><th>Potência</th><th>W/kg</th><th>Data</th></tr></thead><tbody>
        ${pts.map(p=>`<tr><td>${p.r}</td><td class="n">${p.w} W</td><td class="n">${PESO()?r2(p.w/PESO()):"—"}</td><td class="n">${p.data?fmtData(p.data):"—"}</td></tr>`).join("")}</tbody></table>`}));
  } else partes.push(vazio("Curva de potência", pts.length?`Faltam durações (tens ${pts.length} de 9)`:"Sem recordes de potência",
      "Mete em Registar › Recorde de potência os teus melhores valores de 5 s, 1 min, 5 min e 20 min. Com três ou mais, a curva aparece aqui."));
  return partes.join("");
}

function lerBlocos(){
  return [...document.querySelectorAll("#mBlocos [data-bloco]")].map(r => {
    const val = sel => +r.querySelector(sel).value;
    const nome = r.querySelector("[data-bl]").value.trim();
    if(!nome) return null;
    const a = val("[data-ba]"), b = val("[data-bb]");
    if(!(a && b)) return [nome];
    const bl = [nome, Math.min(a,b), Math.max(a,b)];
    const m = val("[data-bm]");
    if(m) bl.push(m, Math.max(1, val("[data-bn]") || 1), val("[data-bs]") || 0);
    return bl;
  }).filter(Boolean);
}
/* TSS estimado: média das intensidades dos blocos, ponderada por quanto do treino cada um ocupa */
function tssEstimado(min, alvos, zona){
  const comPct = alvos.filter(a => a.length >= 3);
  let intensidade;
  if(comPct.length){
    const maior = Math.max(...comPct.map(a => (a[1]+a[2])/2));
    const media = comPct.reduce((s,a) => s + (a[1]+a[2])/2, 0) / comPct.length;
    intensidade = (media*0.6 + maior*0.4) / 100;           // os blocos fortes pesam mais do que a sua fatia de tempo
  } else {
    const Z = ZONAS.find(z => z.z === zona) || ZONAS[1];
    intensidade = (Z.a + Math.min(Z.b,150)) / 200;
  }
  return Math.round(min/60 * intensidade * intensidade * 100);
}
function prevMeu(){
  const box = el("mPrev"); if(!box) return;
  const min = +el("mMin").value, alvos = lerBlocos(), z = el("mZ").value, manual = +el("mTss").value;
  if(!min){ box.innerHTML = `<span class="tiny muted">Preenche a duração para ver o TSS estimado.</span>`; return; }
  const tss = manual || tssEstimado(min, alvos, z);
  const comW = alvos.filter(a => a.length >= 3).map(a =>
    `<span class="chip">${esc(a[0])} <b>${FTP()?`${Math.round(FTP()*a[1]/100)}–${Math.round(FTP()*a[2]/100)} W`:`${a[1]}–${a[2]}% FTP`}</b></span>`).join("");
  const passos = passosDoMeu({alvos});
  const somaBlocos = Math.round(passos.reduce((a,x)=>a+x.segundos,0)/60);
  box.innerHTML = `<span class="chip">Duração <b>${fmtMin(min)}</b></span>
    <span class="chip">TSS ${manual?"":"estimado "}<b>${tss}</b></span>${comW}

      :`<span class="chip">Garmin <b>falta a duração dos blocos</b></span>`}`;
}

  <div class="card"><h3>Treinos de rolo no MyWhoosh</h3>
    <p class="small muted" style="margin-top:4px">Os treinos estruturados de interior existem como ficheiros, na pasta <span class="mono">Treino/treinos-rolo/</span>: em <span class="mono">.zwo</span> e em <span class="mono">.mrc</span>. Importa o formato que o MyWhoosh aceitar — ambos definem a potência em percentagem do FTP, por isso ajustam-se sozinhos sempre que atualizares o teu FTP na app.</p>
    <ul class="bul" style="margin-top:9px">
      <li><b>Põe o FTP certo no MyWhoosh</b> antes de começar, e repete-o depois de cada teste. É o número com que a app calcula todos os watts do treino.</li>
      <li><b>Modo ERG ligado</b> nos blocos: o rolo segura a potência e tu só tens de manter a cadência. Nos blocos de VO2máx entra a pedalar antes de o bloco começar, senão a resistência apanha-te parado.</li>
      <li><b>Modo ERG desligado no teste de 20 minutos</b> — tens de ser tu a escolher o ritmo. Nos restantes testes também.</li>
      <li><b>Regista aqui no fim.</b> Tira do resumo do MyWhoosh a duração, a potência média e a NP, e mete em Registar. O TSS e o resto calculam-se.</li>
      <li>O treino longo de fim de semana não tem ficheiro: é para fazer na estrada, ou em percurso livre se o tempo não deixar.</li>
    </ul></div>
  <div class="card"><h3>O vocabulário todo, em português</h3>
    <dl class="gloss" style="margin-top:10px">
      <dt>Watt (W)</dt><dd>A potência que estás a produzir, agora. Ao contrário da velocidade, não mente: não muda com o vento, a subida ou os pneus. É por isso que o potenciómetro vale mais do que tudo o resto junto.</dd>
      <dt>FTP</dt><dd><i>Functional Threshold Power</i>, a potência que conseguirias manter cerca de uma hora. É a régua de todo o treino: todas as zonas e todos os TSS saem deste número. Mede-se com um teste, de seis em seis semanas.</dd>
      <dt>W/kg</dt><dd>FTP a dividir pelo peso. Em terreno plano manda o watt absoluto; em subida manda o W/kg. Subir o FTP 10 W ou perder 1 kg dão resultados parecidos numa subida longa.</dd>
      <dt>NP — potência normalizada</dt><dd>Uma média \"corrigida\" que dá mais peso aos picos. Numa saída irregular, com arranques e subidas, a NP é muito maior do que a média simples — e representa melhor o que o corpo sentiu. É o número a usar para o TSS.</dd>
      <dt>IF — fator de intensidade</dt><dd>NP a dividir pelo FTP. 0,65 é uma rodagem; 0,85 um treino sério; 0,95 ou mais é teste ou prova curta. Diz quão duro foi, independentemente do tempo.</dd>
      <dt>TSS</dt><dd>Intensidade e duração num só número. Uma hora exatamente no FTP = 100 TSS. Uma rodagem de duas horas em Z2 ≈ 110. Um longo de 3h30 com blocos ≈ 210. É a moeda com que se mede a carga de treino.</dd>
      <dt>VI — índice de variabilidade</dt><dd>NP a dividir pela média. Perto de 1,00 significa que pedalaste a um ritmo constante — é o que se quer num longo de Z2 ou num contrarrelógio. Acima de 1,15 andaste aos saltos.</dd>
      <dt>kJ</dt><dd>O trabalho mecânico produzido. Na prática, 1 kJ ≈ 1 kcal gasta a pedalar — por isso é a estimativa mais honesta de consumo que existe no ciclismo.</dd>
      <dt>CTL — forma</dt><dd>Média da tua carga diária nos últimos 42 dias. Sobe devagar, desce devagar: é a tua base. Subi-la é o objetivo de fundo do plano.</dd>
      <dt>ATL — fadiga</dt><dd>A mesma média, mas a 7 dias. Reage depressa a um fim de semana forte.</dd>
      <dt>TSB — frescura</dt><dd>Forma menos fadiga. Positivo: estás descansado. Muito negativo durante dias: estás a cavar um buraco. Antes de um teste ou de uma prova, queres TSB entre +5 e +15.</dd>
    </dl></div>
  <div class="card"><h3>Os dois testes de FTP</h3>
    <div class="grid2" style="margin-top:10px;gap:14px">
      <div><h4 style="font-family:var(--disp)">Rampa — 45 min</h4>
        <ul class="bul" style="margin-top:6px">
          <li>Aquece 15 min em Z2 com 3×30 s a 100 rpm.</li>
          <li>Começa em 100 W e <b>sobe 20 W a cada minuto</b>.</li>
          <li>Sentado, até não conseguires manter 70 rpm.</li>
          <li><b>FTP = 75% da potência do último minuto completo.</b></li>
          <li>Mais fácil de gerir mentalmente, ideal para o primeiro teste.</li>
        </ul></div>
      <div><h4 style="font-family:var(--disp)">20 minutos — 70 min</h4>
        <ul class="bul" style="margin-top:6px">
          <li>Aquece 20 min, com 3×1 min forte e 5 min solto.</li>
          <li><b>20 min no máximo que consegues sustentar.</b></li>
          <li>Os primeiros 5 min conservadores; aperta no fim.</li>
          <li><b>FTP = 95% da média dos 20 min.</b></li>
          <li>Mais preciso, mas exige saber dosear — usa-o a partir do segundo teste.</li>
        </ul></div>
    </div>
    <p class="tiny muted" style="margin-top:11px">Faz sempre no rolo, com ventilador, descansado (dia fácil ou de descanso antes), sem café a mais do que o habitual e à mesma hora do dia. Mudar o protocolo entre testes é a maneira mais rápida de deixar de poder comparar.</p></div>
  <div class="card"><h3>Erros de quem começa com potenciómetro</h3>
    <ul class="bul" style="margin-top:9px">
      <li><b>Andar sempre em Z3.</b> O erro clássico: os dias fáceis saem demasiado duros e os duros demasiado fracos. Em Z2 tens de te sentir a ir devagar.</li>
      <li><b>Perseguir o número em cada subida.</b> Num longo de Z2 deixa a potência subir na subida e recupera na descida — o que conta é a média da saída.</li>
      <li><b>Testar o FTP de duas em duas semanas.</b> Cansa e não mede nada. Seis semanas é o intervalo mínimo útil.</li>
      <li><b>Comparar watts com outras pessoas.</b> Compara com o teu próprio número de há três meses — é a única comparação que tem sentido.</li>
      <li><b>Esquecer a calibração.</b> Dois minutos esquecidos e vês 10 W de diferença que não existem.</li>
      <li><b>Subir a carga sempre.</b> A quarta semana de cada bloco é leve de propósito. É nela que o FTP sobe.</li>
    </ul></div>`;
}

   5. Excel: exportar e importar
   ============================================================ */
function construirLivro(){
  const ftp = FTP(), peso = PESO(), wb = XLSX.utils.book_new();
  const add = (nome, aoa, larguras) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    if(larguras) ws["!cols"] = larguras.map(w => ({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws, nome);
  };
  add("Perfil", [["Campo","Valor"],
    ["Nome",S.perfil.nome||""],["Data de nascimento",S.perfil.nasc||""],["Peso (kg)",peso||""],["Altura (cm)",S.perfil.altura||""],
    ["FTP (W)",ftp||""],["Data do FTP",S.perfil.ftpData||""],["W/kg", ftp&&peso?r2(ftp/peso):""],
    ["FC maxima",S.perfil.fcmax||""],["FC repouso",S.perfil.fcrep||""],["Pedaleira (mm)",S.perfil.pedaleira||170],
    ["Objetivo",S.perfil.objetivo||""],["Inicio do plano",S.perfil.inicioPlano||""],["Exportado em",hojeISO()]], [24,34]);

  add("Zonas", [["Zona","Nome","% FTP min","% FTP max","Watts min","Watts max","Para que serve"],
    ...ZONAS.map(z=>[z.z,z.nome,z.a,z.b,ftp?Math.round(ftp*z.a/100):"",ftp?Math.round(ftp*z.b/100):"",z.para])], [7,16,11,11,11,11,62]);

  add("Plano", [["Semana","Ciclo","Semana do ciclo","Bloco","Dia","Sessao","Local","Duracao (min)","TSS alvo","Zona","Origem","Estado","Blocos","Descricao"],
    ...planoExport().map(p=>[p.sAbs||"", p.sAbs?cicloNum(p.sAbs):"", p.sAbs?semBase(p.sAbs):"", p.b, DIAS[p.d]||"", p.t, p.loc, p.min, p.tss, p.z,
      p.custom?"Meu":"Plano", S.feitas[planoId(p)]?"Feito":"",
      (p.alvos||[]).map(a => a.length>=3 ? `${a[0]} ${a[1]}-${a[2]}% FTP${a[3]?` ${a[3]} min`:""}${a[4]>1?` ×${a[4]}`:""}` : a.join(" ")).join(" | "), p.desc||""])],
    [8,7,15,20,22,30,10,13,10,7,8,9,60,100]);

  const ss = [...S.sessoes].sort((a,b)=>(a.data<b.data?-1:1));
  add("Sessoes", [["Data","Semana","Titulo","Local","Duracao (min)","Distancia (km)","Pot. media (W)","NP (W)","IF","TSS","kJ","VI","FC media","FC max","Cadencia","RPE","Peso (kg)","Estimado","Notas"],
    ...ss.map(s=>[s.data,s.data?segunda(s.data):"",s.titulo||"",s.local||"",s.min||"",s.km||"",s.pm||"",s.np||"",
      s.if!=null?s.if:"",s.tss||"",s.kj||"",s.vi!=null?s.vi:"",s.fcm||"",s.fcx||"",s.cad||"",s.rpe||"",s.peso||"",s.estimado?"sim":"",s.notas||""])],
    [11,11,28,10,13,14,14,9,7,7,8,7,10,9,10,6,10,9,60]);

  const ts = [...S.testes].sort((a,b)=>(a.data<b.data?-1:1));
  add("Testes", [["Data","Metodo","Valor medido (W)","FTP (W)","Peso (kg)","W/kg","Variacao %","Notas"],
    ...ts.map((t,i)=>{ const ant = i?+ts[i-1].ftp:0;
      return [t.data,t.metodo||"",t.bruto||"",t.ftp||"",t.peso||"",t.peso?r2(t.ftp/t.peso):"",ant?r1((t.ftp-ant)/ant*100):"",t.notas||""]; })],
    [11,14,17,9,10,8,11,50]);

  const carga = serieCarga(S.sessoes);
  add("Carga", [["Data","TSS do dia","CTL (forma)","ATL (fadiga)","TSB (frescura)"],
    ...carga.map(c=>[c.data,c.tss,c.ctl,c.atl,c.tsb])], [11,11,13,13,15]);

  add("Recordes", [["Duracao","Segundos","Potencia (W)","W/kg","Data"],
    ...DURACOES.map(d => { const r = S.recordes[d.k]||{};
      return [d.r,d.s,r.w||"",r.w&&peso?r2(r.w/peso):"",r.data||""]; })], [10,10,13,8,11]);

  const sem = {};
  ss.forEach(s => { const k = segunda(s.data); (sem[k] = sem[k] || {n:0,min:0,km:0,tss:0}); sem[k].n++; sem[k].min += +s.min||0; sem[k].km += +s.km||0; sem[k].tss += +s.tss||0; });
  add("Resumo", [["Semana de","Sessoes","Horas","km","TSS","TSS por hora"],
    ...Object.keys(sem).sort().map(k=>{ const v = sem[k];
      return [k,v.n,r2(v.min/60),r1(v.km),v.tss,v.min?r1(v.tss/(v.min/60)):""]; })], [12,9,8,8,8,13]);

  return wb;
}
async function exportarExcel(){
  /* a biblioteca do Excel vem de fora; sem internet a app continua a funcionar,
     só esta exportação é que não. A cópia de segurança não depende de nada. */
  if(typeof XLSX === "undefined"){ toast("A exportação para Excel precisa de internet. A cópia de segurança não."); return; }
  const btn = el("btnExportar"); if(btn){ btn.disabled = true; btn.textContent = "A preparar…"; }
  try{
    const out = XLSX.write(construirLivro(), {bookType:"xlsx", type:"array"});
    descarregar("Treino_Potencia.xlsx", new Blob([out]));
    toast("Excel descarregado");
  }catch(e){ toast("Não consegui gerar o Excel"); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = "Exportar Treino_Potencia.xlsx"; } }
}
/* cópia de segurança completa, para passar de aparelho ou recuperar */
function exportarCopia(){
  const nome = `Treino_copia_${hojeISO()}.json`;
  descarregar(nome, new Blob([JSON.stringify(instantaneo(), null, 1)], {type:"application/json"}));
  toast("Cópia guardada — mete-a na OneDrive");
}
async function importarCopia(ficheiro){
  try{
    const d = JSON.parse(await ficheiro.text());
    if(!d || typeof d !== "object" || !("perfil" in d)) throw new Error("formato");
    const n = (d.sessoes||[]).length;
    if(!confirm(`Substituir tudo o que está neste aparelho por esta cópia? São ${n} treinos, de ${d.gravadoEm?d.gravadoEm.slice(0,10):"data desconhecida"}.`)) return;
    aplicar(d); guardarLocal(); render();
    toast(`Reposto: ${n} treinos`);
  }catch(e){ toast("Esse ficheiro não é uma cópia válida"); }
}
const dataExcel = v => {
  if(v == null || v === "") return "";
  if(typeof v === "number"){ const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}` : ""; }
  const m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : "";
};
async function importarExcel(ficheiro){
  if(typeof XLSX === "undefined"){ toast("Ler um Excel precisa de internet"); return; }
  try{
    const wb = XLSX.read(await ficheiro.arrayBuffer(), {type:"array"});
    const folha = n => wb.Sheets[n] ? XLSX.utils.sheet_to_json(wb.Sheets[n], {defval:""}) : [];
    let nS = 0, nT = 0, nR = 0;
    const porChave = {}; S.sessoes.forEach(s => porChave[s.data+"|"+(s.titulo||"")] = s.id);
    for(const r of folha("Sessoes")){
      const data = dataExcel(r["Data"]); if(!data) continue;
      const corpo = {data, titulo:String(r["Titulo"]||""), local:String(r["Local"]||"Estrada"),
        min:+r["Duracao (min)"]||0, km:+r["Distancia (km)"]||null, pm:+r["Pot. media (W)"]||null, np:+r["NP (W)"]||null,
        fcm:+r["FC media"]||null, fcx:+r["FC max"]||null, cad:+r["Cadencia"]||null, rpe:+r["RPE"]||null,
        notas:String(r["Notas"]||""), importado:true};
      const m = metricas(corpo, FTP());
      Object.assign(corpo, {if:m.if??null, tss:m.tss??(+r["TSS"]||null), kj:m.kj??null, vi:m.vi??null, estimado:!!m.estimado});
      const id = porChave[data+"|"+corpo.titulo] || ("s"+data.replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,7));
      if(await gravar("sessoes/"+id, corpo)) nS++;
    }
    for(const r of folha("Testes")){
      const data = dataExcel(r["Data"]); const ftp = +r["FTP (W)"]; if(!data || !ftp) continue;
      if(await gravar("testes/t"+data.replace(/-/g,""), {data, metodo:String(r["Metodo"]||"importado"),
        bruto:+r["Valor medido (W)"]||ftp, ftp, peso:+r["Peso (kg)"]||null, notas:String(r["Notas"]||"")})) nT++;
    }
    for(const r of folha("Recordes")){
      const w = +r["Potencia (W)"], s = +r["Segundos"]; if(!w || !s) continue;
      const d = DURACOES.find(x => x.s === s); if(!d) continue;
      if(await gravar("recordes/"+d.k, {w, s, data:dataExcel(r["Data"])||""})) nR++;
    }
    const perfil = folha("Perfil");
    if(perfil.length){
      const mapa = {}; perfil.forEach(r => mapa[String(r["Campo"]||"").trim()] = r["Valor"]);
      const novo = {...S.perfil};
      if(+mapa["Peso (kg)"]) novo.peso = +mapa["Peso (kg)"];
      if(+mapa["FTP (W)"]) novo.ftp = +mapa["FTP (W)"];
      if(+mapa["FC maxima"]) novo.fcmax = +mapa["FC maxima"];
      if(+mapa["FC repouso"]) novo.fcrep = +mapa["FC repouso"];
      if(mapa["Nome"]) novo.nome = String(mapa["Nome"]);
      if(dataExcel(mapa["Inicio do plano"])) novo.inicioPlano = dataExcel(mapa["Inicio do plano"]);
      await gravar("perfil/main", novo);
    }
    toast(`Importado: ${nS} treinos, ${nT} testes, ${nR} recordes`);
  }catch(e){ toast("Não consegui ler esse ficheiro Excel"); }
}
